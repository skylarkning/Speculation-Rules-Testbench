name: Feature request
description: Suggest an improvement to the testbench or investigation workflow
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the investigation problem first, then the behavior that would make the testbench more useful.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rule detection and compatibility
        - Capture workflow
        - Network evidence
        - Comparison and measurements
        - Export and reporting
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What investigation or web-development task is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what the testbench should do and what result it should show.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workaround or other design you considered.
  - type: textarea
    id: examples
    attributes:
      label: Examples or additional context
      description: Add public examples, screenshots, or links that clarify the request.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the information above and removed credentials and private browsing data.
          required: true
