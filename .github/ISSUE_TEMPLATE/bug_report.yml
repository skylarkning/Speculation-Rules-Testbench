name: Bug report
description: Report incorrect behavior or a problem with the testbench
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include cookies, authorization headers, credentials, or private URLs. Sanitized JSON exports can still contain public site URLs, so review them before attaching one.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Page scan and rule detection
        - Enabled capture
        - Blocked-prefetch control
        - Cache clearing
        - Navigation or measurement
        - JSON export
        - Installation or DevTools panel
        - Other
    validations:
      required: true
  - type: input
    id: testbench-version
    attributes:
      label: Testbench version
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: firefox-version
    attributes:
      label: Firefox version
      placeholder: Nightly 155.0a1
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact error text or incorrect measurement.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics
      description: Drag in a screenshot or a reviewed sanitized JSON export. Remove private site information first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the information above and removed credentials and private browsing data.
          required: true
