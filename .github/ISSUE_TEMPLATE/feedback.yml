name: Testbench feedback
description: Report a bug, confusing result, or workflow improvement
title: "[Feedback] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the Speculation Rules Testbench. Do not paste cookies, authorization headers, or private URLs. JSON exports are sanitized, but review remaining site URLs before attaching one.
  - type: dropdown
    id: feedback-type
    attributes:
      label: Feedback type
      options:
        - Incorrect or confusing result
        - Capture workflow problem
        - Site compatibility finding
        - Feature request
        - Documentation
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the steps you followed and what the panel displayed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: firefox-version
    attributes:
      label: Firefox version
      placeholder: Nightly 155.0a1
    validations:
      required: true
  - type: input
    id: testbench-version
    attributes:
      label: Testbench version
      placeholder: 1.3.0
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics
      description: Attach a reviewed sanitized JSON export, or paste a short non-sensitive summary.
